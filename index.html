<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- <link rel="shortcut icon" href="./assets/favicon-16.png" /> -->
    <!-- <link rel="shortcut icon" href="./assets/favicon-32.png" /> -->

    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />

    <meta property="og:title" content="{{ title }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ url }}" />
    <!-- <meta property="og:image" content="./assets/share.png" /> -->
    <meta property="og:description" content="{{ description }}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="{{ twitter }}" />
    <meta name="twitter:title" content="{{ title }}" />
    <meta name="twitter:description" content="{{ description }}" />
    <!-- <meta name="twitter:image" content="./assets/share.png" /> -->

    <link rel="stylesheet" href="./style.scss" />
  </head>
  <body>
    <div class="page">
      <div class="content">
        <form class="content-inner" action="#">
          <div class="header">
            <div class="heading">
              <h1 class="heading-title"></h1>
              <span class="heading-caret"></span>
            </div>

            <input
              class="header-input heading-title"
              type="email"
              name="email"
              placeholder="What is your email?"
            />
          </div>

          <p class="description">{{ description }}</p>

          <div class="buttons">
            <div class="button join-button">
              <button type="button">Join the beta.</button>
            </div>
            <div class="button sign-up-button">
              <button type="submit">Sign me up.</button>
            </div>
          </div>
        </form>
      </div>

      <div class="footer">
        <p>© Copyright {{ year }} Beam.</p>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
