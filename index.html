<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="./assets/favicon-16.png" />
    <link rel="shortcut icon" href="./assets/favicon-32.png" />

    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />

    <meta property="og:title" content="{{ title }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ url }}" />
    <meta property="og:image" content="./assets/logo.png" />
    <meta property="og:description" content="{{ description }}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="{{ twitter }}" />
    <meta name="twitter:title" content="{{ title }}" />
    <meta name="twitter:description" content="{{ description }}" />
    <meta name="twitter:image" content="./assets/logo.png" />

    <link rel="stylesheet" href="./style.scss" />
  </head>
  <body>
    <div class="page">
      <div class="content">
        <form class="content-inner" action="#">
          <div class="header">
            <div class="heading">
              <h1 class="heading-title"></h1>
              <span class="heading-caret"></span>
            </div>

            <input
              class="header-input heading-title"
              type="email"
              required
              name="email"
              placeholder="john@gmail.com"
              autofocus="on"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>

          <div class="button sign-up-button">
            <button type="submit">Beam me up!</button>
          </div>

          <p class="description">
            A new way to collect your thoughts
            <br />
            and experience the internet.
            <br />
            Coming soon to your Mac.
          </p>

          <div class="buttons">
            <div class="button join-button">
              <button type="button">Join the beta.</button>
            </div>
          </div>

          <div class="readbuttons">
            <div class="button read-button">
              <button type="button">Read the manifesto.</button>
            </div>
          </div>
        </form>
      </div>

      <div class="footer">
        <p class="links">
          <a
            href="https://twitter.com/{{ twitter }}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Twitter
          </a>

          /

          <a
            href="https://angel.co/company/beam-app-1"
            target="_blank"
            rel="noopener noreferrer"
          >
            About
          </a>

          /

          <a
            href="https://angel.co/company/beam-app-1/jobs"
            target="_blank"
            rel="noopener noreferrer"
          >
            Jobs
          </a>

            /

          <a
            href="https://getonbeam.medium.com/beam-bright-paper-1ca4ae41ae0b"
            target="_blank"
            rel="noopener noreferrer"
          >
          Why beam?
          </a>
        </p>
        <p>© {{ year }} Beam.</p>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
